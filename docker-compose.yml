# Flight Watch: one image, two services.
#   api      FastAPI under uvicorn: the page and /api. Reads prices; writes only what
#            is tracked, jobs and owner sessions. Host port 8091.
#   worker   `flighttrack worker`: collects on its own (batches, sweep, deals,
#            alerts, health, canary, job queue, backups). No port.
#
#   cp .env.example .env          # set OWNER_PASSWORD (12+ characters)
#   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
#   open http://<host>:8091/      # then put HTTPS in front (docs/DEPLOYMENT.md)
#
# A demo with no outside requests at all: FLIGHTTRACK_SOURCE=fake docker compose up -d
name: flightwatch

x-hardening: &hardening
  read_only: true # the app only writes to ./data (and /tmp)
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: flightwatch:local
    command:
      ["uvicorn", "--factory", "flighttrack.api.app:production_app",
       "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    env_file:
      - path: .env
        required: false
    environment:
      ENV: prod # production cookies, headers and no API docs, whatever .env says
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ./data:/data
    ports:
      - "8091:8000" # point the tunnel or reverse proxy at http://<host>:8091
    healthcheck:
      # The process answers; /api/health (data freshness) is for people and the status page.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/livez', timeout=8)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      start_interval: 5s
      retries: 3
    mem_limit: 256m
    restart: unless-stopped

  worker:
    <<: *hardening
    image: flightwatch:local
    pull_policy: never # built by the api service above
    command: ["flighttrack", "worker"]
    env_file:
      - path: .env
        required: false
    environment:
      ENV: prod
      TZ: ${TZ:-America/Los_Angeles} # collect.sweep_at and the nightly jobs are local time
      FLIGHTTRACK_SOURCE: ${FLIGHTTRACK_SOURCE:-}
    volumes:
      - ./data:/data # the database (prices and what is tracked), backups, failure pages
    healthcheck:
      # The scheduler touches data/worker.heartbeat every 30 s.
      test: ["CMD", "flighttrack", "healthcheck", "worker"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      start_interval: 5s
      retries: 3
    mem_limit: 384m
    restart: unless-stopped
