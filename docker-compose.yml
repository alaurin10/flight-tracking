# Flight Watch. For now one service: `flighttrack serve` runs the daily collector
# and serves the static page. Later milestones split it into a worker and an API.
#   cp .env.example .env
#   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
#   open http://<host>:8091/   (LAN only: this server has no sign-in yet)
name: flightwatch

x-hardening: &hardening
  read_only: true # the app only writes to ./data (and /tmp)
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  flighttrack:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: flightwatch:local
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-America/Los_Angeles} # the daily run time (--at 03:15) is local time
    volumes:
      - ./data:/data
      # What is tracked, until milestone 3 moves it into the database. Edit it
      # locally; do not commit your real trips.
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8091:8080"
    mem_limit: 384m
    restart: unless-stopped
