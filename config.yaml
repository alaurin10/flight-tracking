# flighttrack configuration.
#
# This file is the whole control surface. There is deliberately no settings UI —
# config changes are rare, and a YAML file is diffable, version-controllable and
# editable over SSH.
#
# It is laid out around the three questions the system answers:
#   1. "My dates are fixed — when should I book?"          → trips
#   2. "Any weekend in a window — which one is cheapest?"  → patterns with a window
#   3. "Tell me when a deal to <region> is announced"      → deals

home: SEA

# ---------------------------------------------------------------------------
# Routes. Every trip and pattern references one of these; the route carries
# the label reports group by, the default target price, and the fetch
# priority (1 = daily, 2 = every 3 days, 3 = weekly).
#
# target_price is in CENTS and is a starting guess, not a measured number.
# max_stops: null = record everything and filter at report time.
# ---------------------------------------------------------------------------
routes:
  - dest: HND
    label: Tokyo
    target_price: 65000      # $650 round trip — sale territory for SEA→Tokyo
    priority: 1
    max_stops: null

  - dest: NRT
    label: Tokyo
    target_price: 60000      # $600 — NRT skews cheaper (ZIPAIR and friends)
    priority: 2
    max_stops: null

  - dest: SLC
    label: Salt Lake City
    target_price: 14000      # $140 round trip — a good SEA→SLC fare
    priority: 1
    max_stops: null

# ---------------------------------------------------------------------------
# 1. Fixed trips — dates already chosen, watching for the moment to book.
#
# Tracked daily right up to departure (min_days_ahead does not apply), with
# their own target price. `flighttrack advise --pattern japan` gives the
# book-or-wait verdict; alerts fire on target, all-time low, or percentile.
#
# EDIT the dates below to your actual itinerary.
# ---------------------------------------------------------------------------
trips:
  - name: japan
    dest: HND
    depart: 2027-04-10
    return: 2027-04-24
    target_price: 80000      # $800 — alert at or under this, whatever the route target says

# ---------------------------------------------------------------------------
# 2. Patterns — recurring shapes, expanded against their routes.
#
#   depart_dow  one weekday or a list
#   nights      trip length (0 = one-way)
#   routes      restrict to these destinations (omit = every route)
#   window      only departures inside [start, end]; may extend past the horizon
#   min_days_ahead  per-pattern override of horizon.min_days_ahead
#
# Reports: `flighttrack report --pattern ski_weekend --sort price`
# ---------------------------------------------------------------------------
patterns:
  # Ski: any Fri→Mon (or Thu→Mon) from January through March, Salt Lake City.
  - name: ski_weekend
    depart_dow: FRI
    nights: 3                # Fri → Mon
    routes: [SLC]
    window: {start: 2027-01-01, end: 2027-03-31}

  - name: ski_long_weekend
    depart_dow: THU
    nights: 4                # Thu → Mon
    routes: [SLC]
    window: {start: 2027-01-01, end: 2027-03-31}

  # Tokyo price surface for planning the next trip: a week or ten days, Saturdays.
  - name: tokyo_week
    depart_dow: SAT
    nights: 7
    routes: [HND, NRT]

  - name: tokyo_10
    depart_dow: SAT
    nights: 10
    routes: [HND, NRT]

# ---------------------------------------------------------------------------
# 3. Announced deals — RSS feeds from deal sites, matched by words.
#
# A post matches a watch when any `origins` word appears, any `destinations`
# word (or a region: europe, japan, asia, hawaii, mexico, caribbean,
# south america, oceania, africa) appears, and the headline price is at or
# under max_price (cents). Test a headline without network:
#   flighttrack deals --test-match "Seattle to Paris for $412 roundtrip"
# ---------------------------------------------------------------------------
deals:
  enabled: true
  feeds:
    - https://www.secretflying.com/feed/
    - https://www.theflightdeal.com/feed/
    - https://www.fly4free.com/feed/
  watches:
    - name: Europe from Seattle
      origins: [Seattle, SEA, "West Coast", "US cities", "U.S. cities", nationwide]
      destinations: [europe]
      max_price: 60000       # $600
    - name: Japan from anywhere US
      origins: [Seattle, SEA, "West Coast", "US cities", "U.S. cities", nationwide]
      destinations: [japan]
      max_price: 70000
  max_alerts_per_run: 5
  lookback_days: 3

# ---------------------------------------------------------------------------
# Horizon for patterns without a window. Below ~21 days fares are last-minute
# and not comparable to advance pricing; beyond ~8 months Google often has no
# inventory.
# ---------------------------------------------------------------------------
horizon:
  min_days_ahead: 21
  max_days_ahead: 240

# ---------------------------------------------------------------------------
# Search parameters applied to every query. carry_on_bags and
# exclude_basic_economy make the recorded number mean one consistent thing;
# set both off to record the true headline minimum.
# ---------------------------------------------------------------------------
search:
  seat: economy              # economy | premium-economy | business | first
  currency: USD
  adults: 1
  carry_on_bags: 1
  exclude_basic_economy: true
  hide_separate_and_self_transfer: false

# ---------------------------------------------------------------------------
# Fetch pacing and sources.
#
# sources     tried in order per query. google_html is our own client (no
#             third-party scraper). fast_flights is an optional independent
#             parser of the same page, used only when ours cannot read it.
#             serpapi is a paid JSON API on someone else's IP — the escape
#             hatch; it is skipped unless serpapi.api_key is set.
# transport   auto = primp (browser TLS fingerprint) if installed, else urllib
# cooldown_hours  after a blocked run: 1st → 1h, 2nd → 4h, 3rd → 12h, then 24h.
#             The next scheduled run skips itself while a cooldown is active.
# ---------------------------------------------------------------------------
fetch:
  sources: [google_html, fast_flights, serpapi]
  transport: auto
  serpapi:
    api_key: ${SERPAPI_KEY}   # leave unset to disable; ~$50/mo for daily use
  max_queries_per_run: 60
  min_sleep_seconds: 4.0
  max_sleep_seconds: 8.0
  abort_after_consecutive_failures: 2
  retry_network_once: true
  retry_sleep_seconds: 30
  cooldown_hours: [1, 4, 12, 24]
  keep_failure_artifacts: 20
  request_timeout_seconds: 30
  offers_per_fetch: 5        # store the cheapest N offers, not just the minimum

# ---------------------------------------------------------------------------
# Calendar sweep (EXPERIMENTAL). One RPC prices ~2 months of departure dates
# for a route/pattern, so the whole grid is refreshed daily and the most
# promising dates are confirmed with a real fetch. Verify on your host first:
#   flighttrack doctor --calendar
# and enable only if the printed prices match the price graph in a browser.
# ---------------------------------------------------------------------------
calendar:
  enabled: false
  max_calls_per_run: 12
  confirm_budget: 6
  priority_boost_pct: 10

# ---------------------------------------------------------------------------
# Alerting. Expect phase 1 to be QUIET for the first few weeks — that is the
# system accumulating, not failing.
# ---------------------------------------------------------------------------
alerts:
  enabled: true
  max_per_run: 3             # beyond this, send one digest instead
  dedup_days: 7              # do not re-alert a query within this window...
  dedup_further_drop_pct: 10 # ...unless it dropped a further N%
  min_observations_for_all_time_low: 5
  consider_observations_within_hours: 48
  percentile_phase2_enabled: false   # flip on once ≥30 days of history exists
  percentile: 20
  percentile_window_days: 60
  history_days_required: 30

# ---------------------------------------------------------------------------
# Health watchdog. `flighttrack run` and `flighttrack health --notify` push a
# notification when nothing has succeeded for max_hours_without_success, when
# every request is failing, or when the page layout appears to have changed.
# ---------------------------------------------------------------------------
health:
  max_hours_without_success: 36
  notify: true
  renotify_hours: 24
  stale_fraction_warn: 0.5

# ---------------------------------------------------------------------------
# Notification. ${VAR} is expanded from the environment at load time.
# Topics on the public ntfy.sh are world-readable to anyone who guesses the
# name — use a long random topic, or self-host and set `server`.
# ---------------------------------------------------------------------------
notify:
  channel: ntfy              # ntfy | smtp | file | none
  ntfy:
    server: https://ntfy.sh
    topic: ${NTFY_TOPIC}
  smtp:
    host: ${SMTP_HOST}
    port: 587
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    to: ${SMTP_TO}
  file:
    path: out/digest.md

output:
  db_path: data/flights.db
  html_path: out/index.html
  failure_dir: data/failures   # raw pages we could not read, last 20
