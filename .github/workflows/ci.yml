name: CI

# Checks only. Nothing is deployed from here: the server builds its own image.
# Actions are pinned to commits; Dependabot keeps them fresh.
# No job talks to Google Flights or the deal feeds: tests use fakes and saved pages,
# the smoke-test API has nothing to fetch, and the compose check runs the worker with
# FLIGHTTRACK_SOURCE=fake (no outside requests at all).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy flighttrack
      - run: uv run pytest
      - name: API schema is up to date
        run: |
          uv run flighttrack schema --out ../frontend/src/lib/api-schema.json
          git diff --exit-code ../frontend/src/lib/api-schema.json
      - name: Offline doctor on the shipped config
        run: uv run flighttrack doctor --offline
      # The image installs the fast-flights fallback; the suite must pass with and without it.
      - name: Tests with the fallback extra
        run: |
          uv sync --frozen --extra fallback
          uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24 ships npm 11; npm 10 has a peer-dependency bug with this tree.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated types match the API schema
        run: |
          npm run types
          git diff --exit-code src/lib/types.gen.ts
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    # The built app in a real browser against the API, on a database seeded by
    # `flighttrack demo` (synthetic history, no network). The Manage specs get a second
    # server with a worker on FLIGHTTRACK_SOURCE=fake (invented prices, no outside requests).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend

  audit:
    # Known vulnerabilities in dependencies. Reported, not blocking: a new advisory
    # shouldn't turn every open PR red; Dependabot opens the fix.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Python dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --all-extras --no-hashes --no-emit-project --format requirements-txt > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev

  docker:
    # Proves the image builds and starts. Nothing is pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/Dockerfile --build-arg GIT_COMMIT=${{ github.sha }} -t flightwatch:ci .
      - name: Smoke test
        # M5: livez 200; health 503 with no prices, 200 after `flighttrack demo`; the
        # overview lists the demo trip; the CSP header is present; sign in and create a trip.
        # M6: / and app routes return the app shell.
        # M7: /manage too; the owner's collecting summary and a search preview answer.
        run: |
          harden="--read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true"
          docker run --rm flightwatch:ci flighttrack --help
          docker run --rm $harden flightwatch:ci flighttrack doctor --offline
          docker run --rm flightwatch:ci sh -c 'test "$GIT_COMMIT" = "${{ github.sha }}" && test "$(id -u)" = 1000'
          mkdir -p /tmp/fw-data && chmod 777 /tmp/fw-data
          docker run -d --name fw $harden -p 8000:8000 -v /tmp/fw-data:/data \
            -e OWNER_PASSWORD=ci-owner-password-123 flightwatch:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/livez && break; sleep 1; done
          code() { curl -s -o /dev/null -w '%{http_code}' "localhost:8000$1"; }
          test "$(code /api/health)" = 503
          docker run --rm --network none $harden -v /tmp/fw-data:/data flightwatch:ci \
            flighttrack demo --db /data/flights.db
          test "$(code /api/health)" = 200
          curl -sf localhost:8000/api/overview | grep -q '"slug":"tokyo-spring"'
          curl -sf -D - -o /dev/null localhost:8000/api/overview | grep -qi '^content-security-policy:'
          curl -sf -D - -o /dev/null localhost:8000/api/overview | grep -qi '^x-robots-tag: noindex'
          curl -sf localhost:8000/robots.txt | grep -q 'Disallow: /'
          # M6: the app shell at / and at any app route (the SPA fallback), with its
          # start-up script's hash in the CSP; the old page is gone.
          for p in / /status /trip/tokyo-spring /manage; do
            curl -sf "localhost:8000$p" | grep -q '<title>Flight Watch</title>'
            curl -sf "localhost:8000$p" | grep -q '/_app/immutable/'
          done
          curl -sf -D - -o /dev/null localhost:8000/ | grep -qi "^content-security-policy:.*script-src 'self' 'sha256-"
          test "$(code /api/no-such-endpoint)" = 404
          curl -sf localhost:8000/api/meta | grep -q '"commit":"${{ github.sha }}"'
          test "$(code /api/admin/trips)" = 401
          # Owner sign-in round trip (Origin as a browser sends it), then a new trip.
          origin='Origin: http://localhost:8000'; json='Content-Type: application/json'
          curl -sf -c /tmp/jar -H "$origin" -H "$json" -d '{"password":"ci-owner-password-123"}' \
            localhost:8000/api/auth/login | grep -q '"is_owner":true'
          trip="{\"name\":\"CI trip\",\"origin\":\"SEA\",\"destination\":\"LAX\",\"depart_date\":\"$(date -d '+60 days' +%F)\",\"return_date\":\"$(date -d '+63 days' +%F)\"}"
          curl -sf -b /tmp/jar -H "$origin" -H "$json" -d "$trip" localhost:8000/api/admin/trips \
            | grep -q '"slug":"ci-trip"'
          curl -s -o /dev/null -w '%{http_code}' -b /tmp/jar -H 'Origin: https://evil.example' \
            -H "$json" -d "$trip" localhost:8000/api/admin/trips | grep -q 403
          curl -sf -b /tmp/jar localhost:8000/api/admin/trips | grep -q '"slug":"ci-trip"'
          curl -sf -b /tmp/jar localhost:8000/api/admin/collecting | grep -q '"max_pairs":1200'
          search='{"name":"CI search","origin":"SEA","destinations":["SLC"],"depart_dows":["FRI"],"nights":2}'
          curl -sf -b /tmp/jar -H "$origin" -H "$json" -d "$search" \
            localhost:8000/api/admin/searches/preview | grep -q '"refresh_days":'
          docker logs fw 2>&1 | head -1 | python3 -c 'import json, sys; json.loads(sys.stdin.read())'
          docker logs fw 2>&1 | tail -20
      - name: Compose check (both services healthy; fake source, no outside requests)
        # M5 acceptance: `docker compose up -d` with only OWNER_PASSWORD set brings both
        # services to healthy. FLIGHTTRACK_SOURCE=fake keeps the worker off Google and
        # the feeds; it stores invented prices, so /api/health turns 200.
        run: |
          docker tag flightwatch:ci flightwatch:local
          mkdir -p data && chmod 777 data
          echo "OWNER_PASSWORD=ci-owner-password-123" > .env
          docker compose run --rm worker flighttrack import-config /app/config/seed.example.yaml
          FLIGHTTRACK_SOURCE=fake docker compose up -d --no-build
          health() { docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q "$1")"; }
          ok=""
          for i in $(seq 1 30); do
            api=$(health api || true); worker=$(health worker || true)
            fresh=$(curl -s -o /dev/null -w '%{http_code}' localhost:8091/api/health || true)
            echo "after $((i * 5)) s: api $api, worker $worker, /api/health $fresh"
            if [ "$api" = healthy ] && [ "$worker" = healthy ] && [ "$fresh" = 200 ]; then ok=1; break; fi
            sleep 5
          done
          docker compose logs | tail -30
          test -n "$ok"
          curl -sf -D - -o /dev/null localhost:8091/api/livez | grep -qi '^strict-transport-security:'  # ENV=prod
          curl -sf localhost:8091/api/overview | grep -q '"trips"'
          curl -sf localhost:8091/ | grep -q '<title>Flight Watch</title>'
          curl -sf localhost:8091/status | grep -q '<title>Flight Watch</title>'
          docker compose exec -T worker flighttrack health
          docker compose down
