# Flight Watch tunables. Committed; nothing personal belongs here.
#
# What is tracked (trips, flexible searches, deal watches and feeds) lives in
# the database: load an old config file with `flighttrack import-config <file>`
# (config/seed.example.yaml is an example), back it up with `export-config`.
# Secrets and per-install values, including HOME_AIRPORT, are in .env.
# Every key has a default in code, so a missing key or a missing file is fine.

# ---------------------------------------------------------------------------
# Announced deals. The watches that match posts are in the database. These
# feeds are polled until a feed is added there (then the database's list wins).
# ---------------------------------------------------------------------------
deals:
  enabled: true
  # Checked 2026-11-14: both return 16 items. The same post can appear in
  # both; it is stored and alerted once. (secretflying.com's feed now
  # redirects to its home page; fly4free.com lists Europe-origin fares.)
  feeds:
    - https://www.theflightdeal.com/feed/
    - https://www.theflightdeal.com/category/flight-deals/seattle-flight-deals/feed/
  max_alerts_per_run: 5
  lookback_days: 3

# ---------------------------------------------------------------------------
# Horizon for patterns without a window. Below ~21 days fares are last-minute
# and not comparable to advance pricing; beyond ~8 months Google often has no
# inventory.
# ---------------------------------------------------------------------------
horizon:
  min_days_ahead: 21
  max_days_ahead: 240

# ---------------------------------------------------------------------------
# Search parameters applied to every query. carry_on_bags and
# exclude_basic_economy make the recorded number mean one consistent thing;
# set both off to record the true headline minimum.
# ---------------------------------------------------------------------------
search:
  seat: economy              # economy | premium-economy | business | first
  currency: USD
  adults: 1
  carry_on_bags: 1
  exclude_basic_economy: true
  hide_separate_and_self_transfer: false

# ---------------------------------------------------------------------------
# Fetch pacing and sources.
#
# sources     tried in order per query. google_html is our own client (no
#             third-party scraper). fast_flights is an optional independent
#             parser of the same page, used only when ours cannot read it.
#             serpapi is a paid JSON API on someone else's IP — the escape
#             hatch; it is skipped unless serpapi.api_key is set.
# transport   auto = primp (browser TLS fingerprint) if installed, else urllib
# cooldown_hours  after a blocked run: 1st → 1h, 2nd → 4h, 3rd → 12h, then 24h.
#             The next scheduled run skips itself while a cooldown is active.
# ---------------------------------------------------------------------------
fetch:
  sources: [google_html, fast_flights, serpapi]
  transport: auto
  serpapi:
    api_key: ${SERPAPI_KEY}   # leave unset to disable; ~$50/mo for daily use
  max_queries_per_run: 25    # until the home address's limit has been measured (`calibrate`)
  min_sleep_seconds: 4.0
  max_sleep_seconds: 8.0
  abort_after_consecutive_failures: 2
  retry_network_once: true
  retry_sleep_seconds: 30
  cooldown_hours: [1, 4, 12, 24]
  keep_failure_artifacts: 20
  request_timeout_seconds: 30
  offers_per_fetch: 5        # store the cheapest N offers, not just the minimum

# ---------------------------------------------------------------------------
# The worker (`flighttrack worker`). Every request to Google (results pages,
# calendar calls, the canary) counts against one rolling 24-hour allowance,
# and the worker learns that allowance (backend/flighttrack/pace.py): it
# starts at pace.start_per_day, rises by step_up_pct after each clean day in
# which it was mostly used, never above max_per_day, and on a block falls to
# 60% of what was sent in the 24 hours before it, holds 3 days, and creeps
# back by 10% a day, staying under 85% of the volume that drew the block.
# Requests go out batch_size at a time, spread evenly over the whole day.
#
# daily_request_budget  set it to pin the allowance to a fixed number instead
#                       of learning it (the e2e tests do).
# shares                each slot goes to the lane furthest under its share
#                       of the last 24 hours: detail = results pages for date
#                       pairs, calendar = 2-month price windows of flexible
#                       searches, explore = whole regions (from D2). A lane
#                       with nothing to do leaves its share to the others.
# trip_refresh_hours    an active trip older than this is fetched first; each
#                       search's top_dates_per_search cheapest dates likewise.
# pair_refresh_hours    every other date pair is due again after this (twice
#                       that for priority 2, four times for priority 3).
# canary_dest           the daily canary: HOME_AIRPORT → here, one way, 30
#                       days out. A busy nonstop route that always has results.
# ---------------------------------------------------------------------------
collect:
  pace:
    start_per_day: 50
    max_per_day: 720         # the owner's ceiling (2026-11-15): one request every 2 min
    step_up_pct: 50
  batch_size: 3
  min_gap_seconds: 60
  shares: {detail: 60, calendar: 25, explore: 15}
  trip_refresh_hours: 4
  pair_refresh_hours: 12
  top_dates_per_search: 3
  canary_dest: LAX

# ---------------------------------------------------------------------------
# Calendar calls. One call prices ~2 months of departure dates for a route
# and trip length. The worker prices each window again when it is
# refresh_hours old and sends each window's flags_per_window most promising
# dates on to a detail fetch, so nothing alerts on a calendar number alone.
# max_calls_per_run and confirm_budget apply only to the one-off
# `flighttrack sweep` and `flighttrack run`.
# Checked from the home address on 2026-11-15: 31 dated prices for SEA→LAX. They
# include basic economy (SEA→LAX Jan 14–18: $287 against $307 on the results
# page), so they are compared only with each other and shown as estimates.
# Google sometimes answers without prices (reported by others since 2026-08);
# the worker then pauses this lane (30 min, 2 h, 6 h, 24 h) and detail goes on.
# ---------------------------------------------------------------------------
calendar:
  enabled: true
  refresh_hours: 6
  flags_per_window: 2
  max_calls_per_run: 12
  confirm_budget: 6
  priority_boost_pct: 10

# ---------------------------------------------------------------------------
# Explore boards (D2). One call to Google's Explore map prices every destination
# of a region (anywhere, europe, asia, …) from an airport for one departure date
# and trip length. A board is priced for every week ahead (horizon above), each
# departure again when it is refresh_hours old, in the explore lane's share.
#
# boards        the built-in "anywhere from HOME_AIRPORT" boards, by trip
#               length in nights (0 = one way): weekends leave on Fridays,
#               a week or longer on Saturdays. Region watches add their own
#               boards (their region, trip length, airport and months).
# fresh_hours   a fare not seen again within this long drops off its board.
# Checked from a cloud sandbox on 2026-11-16: 92 places for SEA→Anywhere, 6 to 8
# of them with a fare per call (the fares Google already has), so a board fills
# in over its departures and over repeated calls. Fares include basic economy:
# they are estimates, like calendar prices.
# ---------------------------------------------------------------------------
explore:
  enabled: true
  refresh_hours: 24
  boards: [3, 7]
  fresh_hours: 72

# ---------------------------------------------------------------------------
# The deal finder (D3). An Explore fare becomes a candidate when it is
# under_usual_pct under the place's usual fare (the median daily low for that
# trip length and travel month over usual_days, once min_history_days days are
# in), at or under a region watch's price, or new_low_pct under the lowest seen
# before. Until a place has that history, each board's cheapest_per_board
# places are candidates instead. A candidate is searched once on the results
# page with your bag and fare filters: confirmed when the real fare is within
# confirm_slack_pct of the estimate (or under the watch's price), else gone.
# Confirmed finds are searched again every recheck_hours; one alert per find,
# and another only when it drops renotify_drop_pct further.
# ---------------------------------------------------------------------------
finds:
  enabled: true
  under_usual_pct: 25
  new_low_pct: 10
  usual_days: 45
  min_history_days: 7
  cheapest_per_board: 3
  confirm_slack_pct: 30
  recheck_hours: 12
  renotify_drop_pct: 10

# ---------------------------------------------------------------------------
# Alerting. Expect phase 1 to be QUIET for the first few weeks — that is the
# system accumulating, not failing.
# ---------------------------------------------------------------------------
alerts:
  enabled: true
  max_per_run: 3             # beyond this, send one digest instead
  dedup_days: 7              # do not re-alert a query within this window...
  dedup_further_drop_pct: 10 # ...unless it dropped a further N%
  min_observations_for_all_time_low: 5
  consider_observations_within_hours: 48
  percentile_phase2_enabled: false   # flip on once ≥30 days of history exists
  percentile: 20
  percentile_window_days: 60
  history_days_required: 30

# ---------------------------------------------------------------------------
# Health watchdog. `flighttrack run` and `flighttrack health --notify` send a
# notification when nothing has succeeded for max_hours_without_success, when
# every request is failing, or when the page layout appears to have changed.
# ---------------------------------------------------------------------------
health:
  max_hours_without_success: 36
  notify: true
  renotify_hours: 24
  stale_fraction_warn: 0.5

# ---------------------------------------------------------------------------
# Retention. Keeps the database small on a box with little disk. The
# cheapest-offer price series (what alerts, lows and percentiles use) is
# NEVER pruned; only the 2nd–5th cheapest offers per fetch, sweep context
# rows and the per-request log age out. `flighttrack run` compacts weekly.
# ---------------------------------------------------------------------------
retention:
  enabled: true
  runner_up_days: 90
  attempts_days: 180
